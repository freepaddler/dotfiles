[env]
# Go's default GOPATH; kept explicit so it can be changed here.
GOPATH = "{{ env.HOME }}/go"

[tools]
go = "1.27"
"go:github.com/posener/complete/v2/gocomplete" = "latest"
"go:go.uber.org/mock/mockgen" = "latest"
"go:golang.org/x/pkgsite/cmd/pkgsite" = "latest"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "latest"
"go:google.golang.org/grpc/cmd/protoc-gen-go-grpc" = "latest"
"go:github.com/swaggo/swag/cmd/swag" = "latest"
